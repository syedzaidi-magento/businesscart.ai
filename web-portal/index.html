<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <title>BusinessCart.ai: Your Commerce, Your Rules.</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "BusinessCart.ai",
      "description": "BusinessCart.ai is a headless, API-first B2B e-commerce platform designed for businesses that require per-customer personalization, such as custom pricing, catalogs, and negotiable quotes. It offers a commission-free alternative to marketplaces, allowing businesses to own their customer data and brand experience.",
      "image": "https://businesscart.ai/icon-512x512.png",
      "brand": {
        "@type": "Brand",
        "name": "BusinessCart.ai"
      },
      "audience": [
        {
          "@type": "Audience",
          "audienceType": "B2B",
          "name": "Mid-Market Businesses (Manufacturers, Distributors, Wholesalers)"
        },
        {
          "@type": "Audience",
          "audienceType": "D2C",
          "name": "Direct-to-Consumer Brands & Local Businesses"
        }
      ],
      "isRelatedTo": [
        {
          "@type": "Product",
          "name": "Shopify Plus"
        },
        {
          "@type": "Product",
          "name": "WooCommerce"
        },
        {
          "@type": "Service",
          "name": "Uber Eats"
        },
        {
          "@type": "Service",
          "name": "DoorDash"
        }
      ],
      "offers": {
        "@type": "Offer",
        "priceCurrency": "USD",
        "price": "0",
        "availability": "https://schema.org/InStock",
        "name": "Starter Tier",
        "description": "No monthly fee at any volume. 6% on your first 100 orders each month, 2% on orders 101 to 1,000, 1% beyond. Never more than $5 per order."
      },
      "mainEntityOfPage": "https://businesscart.ai"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
